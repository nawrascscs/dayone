{% extends 'base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/courses.css" />
{% endblock %}

{% block content %}
<section class="courses-page container">
    <div class="page-intro">
        <h1>Browse Courses</h1>
        <p>Explore courses by keyword, skill area, and popularity.</p>
    </div>

    <div class="course-actions">
        <div class="filter-bar">
            <div class="search-group">
                <input id="course-search" class="course-search-input" type="search" placeholder="Search courses, instructors, or topics" />
                <button id="course-search-button" class="button primary" type="button">Search</button>
            </div>
            <select id="course-skill-filter">
                <option value="">All skills</option>
            </select>
        </div>
    </div>

    <div id="courses-grid" class="course-grid"></div>
    <div id="courses-pagination" class="pagination"></div>
</section>
{% endblock %}

{% block extra_js %}
<script src="/static/js/courses.js"></script>
{% endblock %}
